trigger:
- main  # Trigger on push to the 'main' branch

pool: agent3
 

steps:
# Step 1: Install Java 21 using Java Tool Installer (if it's not already installed)
- task: JavaToolInstaller@0
  inputs:
    versionSpec: '21'  # Install Java 21
    jdkArchitectureOption: 'x64'  # 64-bit architecture
    jdkSourceOption: 'PreInstalled'  # If Java is already installed, use the pre-installed version

# Step 2: Set JAVA_HOME for Java 21 (just to ensure it's set correctly for Maven)
- script: |
    echo "Setting JAVA_HOME for Java 21"
    export JAVA_HOME=$(C:/Program\ Files/Java/jdk-21)  # Adjust to your actual installation path of Java 21
    echo "JAVA_HOME set to $JAVA_HOME"
  displayName: 'Set JAVA_HOME for Java 21'

# Step 3: Run Maven build (including tests)
- task: Maven@4  # Use Maven task version 4
  inputs:
    mavenPomFile: 'pom.xml'  # Path to your pom.xml file
    goals: 'clean install'  # Run Maven goals: clean and install
    testResultsFiles: '**/surefire-reports/TEST-*.xml'  # Path for test results
    jdkVersionOption: '1.21'  # Specify JDK 21 (use '1.21' for Java 21)
    jdkArchitectureOption: 'x64'  # Architecture (use x64 for 64-bit)
    publishJUnitResults: true  # Publish JUnit test results
  displayName: 'Run Maven Build with Java 21'
