trigger:
- main  # Change to your desired branch (e.g., main)

pool: agent3

steps:
# Step 1: Download OpenJDK 21 manually from Adoptium
- script: |
    Invoke-WebRequest -Uri "https://github.com/AdoptOpenJDK/openjdk21/releases/download/jdk-21%2B35/OpenJDK21U-jdk_x64_windows_hotspot_21_35.zip" -OutFile "C:\openjdk21.zip"
    Expand-Archive -Path "C:\openjdk21.zip" -DestinationPath "C:\OpenJDK"
    [System.Environment]::SetEnvironmentVariable("JAVA_HOME", "C:\OpenJDK", [System.EnvironmentVariableTarget]::Machine)
    [System.Environment]::SetEnvironmentVariable("PATH", "$env:PATH;C:\OpenJDK\bin", [System.EnvironmentVariableTarget]::Machine)
  displayName: 'Install OpenJDK 21 from Adoptium'

# Step 2: Verify Java Installation
- script: |
    java -version  # Verify that Java 21 has been installed successfully
  displayName: 'Verify Java Version'

# Step 3: Run Maven Build and Tests
- task: Maven@4  # Use Maven task version 4
  inputs:
    mavenPomFile: 'pom.xml'  # Path to your pom.xml file
    goals: 'clean test'  # Run tests after cleaning
    testResultsFiles: '**/surefire-reports/TEST-*.xml'  # Path for test result files
    jdkVersionOption: '1.21'  # Specify Java version (1.21 for Java 21)
    jdkArchitectureOption: 'x64'  # Use 64-bit Java
    publishJUnitResults: true  # Publish test results
  displayName: 'Run Maven Build and Tests'

# Step 4: Publish Test Results (Optional but recommended)
- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'  # Format used by Maven Surefire
    testResultsFiles: '**/surefire-reports/TEST-*.xml'  # Path to test result files
    mergeTestResults: true  # Merge results if there are multiple test result files
    publishRunAttachments: true  # Publish any attachments from the test run
  displayName: 'Publish Test Results'
