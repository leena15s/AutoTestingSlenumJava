trigger:
- main  # Trigger on push to the 'main' branch

pool: agent3

steps:
  # 1. PowerShell task (inline script)
  - task: PowerShell@2
    inputs:
      targetType: 'inline'  # Use inline PowerShell script.
      script: |
        Write-Host "This is a test message from PowerShell!"
    displayName: 'Run Inline PowerShell Script'

  # 2. Maven build step (example)
  - task: Maven@3
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'clean install'
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
    displayName: 'Run Maven Build'

  # 3. Additional steps (if necessary)
  - script: echo "Hello from a shell script"
    displayName: 'Run Shell Script'
